name: ctmesh
# Mesh pipeline (S2) tests, including the hazard tests (left/right flip, scale and units, anisotropic and
# oblique grids, scan-edge truncation, determinism). Phantoms only: no downloads, no patient data.
on:
  push:
    paths: ["src/emgmirror/ctmesh/**", "tests/ctmesh/**", "requirements-ctmesh.txt", ".github/workflows/ctmesh.yml"]
  pull_request:
    paths: ["src/emgmirror/ctmesh/**", "tests/ctmesh/**", "requirements-ctmesh.txt", ".github/workflows/ctmesh.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -r requirements-ctmesh.txt
      - run: python -m pytest tests/ctmesh -q
