[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emgmirror-ct"
version = "0.2.0"
description = "CT volume intake, segmentation orchestration, and 3D visualization research software"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydicom>=3.0",
    "SimpleITK>=2.5",
    "nibabel>=5.3",
    "scikit-image>=0.25",
    "trimesh>=4.5",
    "networkx>=3.0",
    "fast-simplification>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ct3d = "emgmirror.ctapp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emgmirror = ["ctseg/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
