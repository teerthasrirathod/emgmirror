<!doctype html>
<html><head><meta charset="utf-8"><title>ctmesh render</title>
<style>html,body{margin:0;background:#f4f4f2;overflow:hidden}canvas{display:block}
#lab{position:fixed;left:14px;top:10px;font:600 22px system-ui,sans-serif;color:#333}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div id="lab"></div>
<script type="module">
// Renders a GLB written by emgmirror.ctmesh (or the old pipeline, converted to the same frame) for the S2
// benchmark. Query: ?glb=URL&view=anterior|left|right|posterior|superior&only=name1,name2&label=TEXT&zoom=1
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);
document.getElementById('lab').textContent = q.get('label') || '';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf4f4f2);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8070, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); scene.add(fill);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const only = q.get('only') ? new Set(q.get('only').split(',')) : null;
loader.load(q.get('glb'), (g) => {
  const root = g.scene;
  root.traverse(o => {
    if (o.isMesh) {
      if (only && !only.has(o.name) && !only.has(o.parent?.name)) o.visible = false;
      o.material.side = THREE.FrontSide; o.material.flatShading = q.get('flat') === '1';
    }
  });
  scene.add(root);
  const box = new THREE.Box3();
  root.traverse(o => { if (o.isMesh && o.visible) box.expandByObject(o); });
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const dirs = {anterior: [0, 0, 1], posterior: [0, 0, -1], left: [1, 0, 0], right: [-1, 0, 0], superior: [0, 1, 0.001]};
  const d = new THREE.Vector3(...(dirs[q.get('view') || 'anterior']));
  const r = 0.5 * s.length() / parseFloat(q.get('zoom') || '1');
  const cam = new THREE.PerspectiveCamera(22, W / H, r / 100, r * 100);
  cam.position.copy(c).addScaledVector(d, r / Math.tan(THREE.MathUtils.degToRad(11)) * 0.62);
  cam.up.set(0, 1, 0); cam.lookAt(c);
  key.position.copy(cam.position).add(new THREE.Vector3(r, r * 1.5, 0)); key.target.position.copy(c); scene.add(key.target);
  fill.position.copy(c).add(new THREE.Vector3(-r * 2, -r, -r)); fill.target.position.copy(c); scene.add(fill.target);
  renderer.render(scene, cam);
  let tris = 0; root.traverse(o => { if (o.isMesh && o.visible) tris += o.geometry.index.count / 3; });
  window.__done = {tris};
}, undefined, (e) => { window.__done = {error: String(e)}; });
</script></body></html>
