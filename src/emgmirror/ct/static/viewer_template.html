<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f6f6f3;--panel:#ffffff;--ink:#1f2428;--muted:#68717a;--line:#e1e1dc;--accent:#1d7a70;--accent-ink:#ffffff;
--canvas:#ebeeed;--slice:#14171a;--soft:#f0f1ee;--focus:#1d7a70;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--panel:#1c1f24;--ink:#e6e8ea;--muted:#9aa2aa;
--line:#2c3138;--accent:#5cc4b8;--accent-ink:#0b1412;--canvas:#101214;--slice:#0b0c0e;--soft:#252a30;--focus:#5cc4b8;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
min-height:100vh;display:flex;flex-direction:column}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
h3{font-size:14px;font-weight:600;margin:0}
p{margin:0}
.top{padding:24px 28px 8px}
.top p{color:var(--muted);margin-top:2px}
#msg{margin:8px 28px;padding:12px 16px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:12px 28px 20px;flex:1;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.card,.cell{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card{padding:16px 18px}
.card>h2{margin-bottom:10px}
main{min-width:0;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px 16px}
.bar .grp{display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cell{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cellhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 8px;flex-wrap:wrap}
.cellhead .sub{color:var(--muted);font-size:13px}
.cv{position:relative;flex:1;min-height:300px}
#cell3d .cv{min-height:380px;background:var(--canvas)}
.sl .cv{background:var(--slice)}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cv canvas.ov{pointer-events:none}
.ctl{display:flex;align-items:center;gap:10px;padding:8px 14px 2px}
.ctl label{color:var(--muted);font-size:13px}
.ctl input[type=range]{flex:1;min-width:0}
.ctl output{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:5.5em;text-align:right}
.readout{padding:2px 14px 10px;font-size:13px;color:var(--muted);min-height:2em;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink);font-weight:600}
button{font:inherit;font-size:13px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;
padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.link{background:none;border:0;padding:0 2px;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=range]{accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:4px 12px;cursor:pointer;font-size:13px;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px}
.group{margin-top:12px}
.group:first-child{margin-top:0}
.ghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ghead .acts{font-size:12px;display:flex;gap:8px}
ul.rows{list-style:none;margin:0;padding:0}
.row{border-radius:8px;padding:3px 6px}
.row.sel{background:var(--soft)}
.rhead{display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.rname{flex:1;text-align:left;background:none;border:0;padding:3px 2px;font-size:14px;border-radius:6px}
.row.sel .rname{font-weight:600}
.detail{padding:4px 2px 8px 26px;font-size:13px}
.detail .explain{color:var(--muted);margin-bottom:6px}
.detail .op{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.detail .op input{flex:1;min-width:0}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
details[open] summary{margin-bottom:10px}
.about p,.about ul{margin:0 0 10px;font-size:14px}
.about ul{padding-left:18px}
.about .fine{color:var(--muted);font-size:13px}
footer{padding:14px 28px 22px;color:var(--muted);font-size:13px;text-align:center}
.hint3d{padding:0 14px 10px;font-size:13px;color:var(--muted);min-height:2em}
.hint3d b{color:var(--ink);font-weight:600}
.hidden{display:none!important}
@media (max-width:980px){
.layout{grid-template-columns:minmax(0,1fr);padding:10px 16px 16px}
.top{padding:18px 16px 4px}
#msg{margin:8px 16px}
.grid{grid-template-columns:minmax(0,1fr)}
.cv{min-height:280px}
#cell3d .cv{min-height:340px}
footer{padding:12px 16px 20px}
}
</style>
</head>
<body>
<header class="top"><h1 id="title"></h1><p id="subtitle"></p></header>
<div id="msg" role="status">Unpacking the scan data...</div>
<div class="layout" id="layout" hidden>
  <aside class="side">
    <section class="card" id="structs"><h2>Structures</h2><div id="groups"></div></section>
    <section class="card about" id="about"><details open><summary>About this scan</summary><div id="aboutbody"></div></details></section>
  </aside>
  <main>
    <div class="cell bar" id="slicebar">
      <div class="grp" role="radiogroup" aria-label="Brightness setting for the slices">
        <span class="chk">Show</span>
        <span class="seg">
          <label><input type="radio" name="win" value="bone" aria-label="Bone window"> Bone</label>
          <label><input type="radio" name="win" value="soft" aria-label="Soft tissue window" checked> Soft tissue</label>
        </span>
      </div>
      <div class="grp" id="ovgrp">
        <label class="chk"><input type="checkbox" id="ovon"> Colour the structures on the slices</label>
        <input type="range" id="ovop" min="0.1" max="1" step="0.05" value="0.45" aria-label="Strength of the colour overlay">
      </div>
    </div>
    <div class="grid" id="grid">
      <section class="cell" id="cell3d" aria-label="3D view">
        <div class="cellhead"><h2>3D view</h2>
          <span style="display:flex;gap:6px;flex-wrap:wrap">
            <button id="btn-measure" aria-pressed="false" title="Click two points on the surface to measure between them">Measure</button>
            <button id="btn-planes" aria-pressed="true" title="Show where the three slices cut through the model">Slice outlines</button>
            <button id="btn-reset" title="Return to the starting view">Reset view</button>
          </span></div>
        <div class="cv" id="cv3d">
          <canvas id="gl" tabindex="0" aria-label="3D model. Drag to turn, right-drag or shift-drag to move, scroll to zoom. Arrow keys turn, plus and minus zoom, 0 resets."></canvas>
          <canvas id="ov3d" class="ov" aria-hidden="true"></canvas>
        </div>
        <div class="hint3d" id="hint3d">Drag to turn. Right-drag to move. Scroll to zoom.</div>
      </section>
    </div>
  </main>
</div>
<footer id="foot">__DISCLAIMER__</footer>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(async function () {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ''); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
}
const msg = $('#msg');
function say(t) { msg.textContent = t; msg.hidden = false; }
const DISCLAIMER = $('#foot').textContent.trim();

// ---------- decode ----------
if (typeof DecompressionStream === 'undefined') {
  say('This browser cannot unpack the scan data (DecompressionStream is missing). Please open this file in a recent version of Chrome, Edge, Firefox or Safari.');
  return;
}
function b64bytes(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function gunzip(u8) {
  const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
let P;
try { P = JSON.parse($('#payload').textContent); } catch (e) { say('The scan data in this file is damaged.'); return; }
const meta = P.meta || {};
$('#title').textContent = meta.title || 'CT scan';
$('#subtitle').textContent = meta.subtitle || '';
$('#subtitle').hidden = !meta.subtitle;

const meshes = [];
try {
  for (const m of P.meshes) {
    const q = new Uint16Array((await gunzip(b64bytes(m.verts))).buffer);
    const f = new Uint32Array((await gunzip(b64bytes(m.faces))).buffer);
    const v = new Float32Array(q.length), b = m.bbox;
    for (let i = 0; i < q.length; i += 3) for (let a = 0; a < 3; a++) v[i + a] = b[a] + q[i + a] * (b[a + 3] - b[a]) / 65535;
    // make winding outward for closed meshes (signed volume), then area-weighted vertex normals
    const cx = (b[0] + b[3]) / 2, cy = (b[1] + b[4]) / 2, cz = (b[2] + b[5]) / 2;
    let sv = 0;
    for (let t = 0; t < f.length; t += 3) {
      const i = f[t] * 3, j = f[t + 1] * 3, k = f[t + 2] * 3;
      const ax = v[i] - cx, ay = v[i + 1] - cy, az = v[i + 2] - cz, bx = v[j] - cx, by = v[j + 1] - cy, bz = v[j + 2] - cz,
        ccx = v[k] - cx, ccy = v[k + 1] - cy, ccz = v[k + 2] - cz;
      sv += ax * (by * ccz - bz * ccy) - ay * (bx * ccz - bz * ccx) + az * (bx * ccy - by * ccx);
    }
    if (sv < 0) for (let t = 0; t < f.length; t += 3) { const x = f[t + 1]; f[t + 1] = f[t + 2]; f[t + 2] = x; }
    const n = new Float32Array(v.length);
    for (let t = 0; t < f.length; t += 3) {
      const i = f[t] * 3, j = f[t + 1] * 3, k = f[t + 2] * 3;
      const ux = v[j] - v[i], uy = v[j + 1] - v[i + 1], uz = v[j + 2] - v[i + 2];
      const wx = v[k] - v[i], wy = v[k + 1] - v[i + 1], wz = v[k + 2] - v[i + 2];
      const nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      for (const p of [i, j, k]) { n[p] += nx; n[p + 1] += ny; n[p + 2] += nz; }
    }
    for (let i = 0; i < n.length; i += 3) {
      const l = Math.hypot(n[i], n[i + 1], n[i + 2]) || 1; n[i] /= l; n[i + 1] /= l; n[i + 2] /= l;
    }
    const c = m.color, rgb = [parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255, parseInt(c.slice(5, 7), 16) / 255];
    meshes.push(Object.assign({}, m, { v, f, n, rgb, ctr: [cx, cy, cz], diag: Math.hypot(b[3] - b[0], b[4] - b[1], b[5] - b[2]),
      verts: null, faces: null }));
  }
} catch (e) { say('The 3D data in this file could not be unpacked: ' + e.message); return; }

let geo = null, vol = null, lab = null;
if (P.volume) {
  const g = P.volume;
  geo = { n: g.size, sp: g.spacing, org: g.origin, D: g.direction };
  vol = new Int16Array((await gunzip(b64bytes(g.data))).buffer);
  if (P.labels) lab = new Uint8Array((await gunzip(b64bytes(P.labels))).buffer);
}
msg.hidden = true;
$('#layout').hidden = false;

// ---------- geometry helpers ----------
function idx2phys(c) { // c = fractional index [i,j,k]; physical = origin + D @ (idx * spacing)
  const o = [0, 0, 0];
  for (let r = 0; r < 3; r++) o[r] = geo.org[r] + geo.D[r * 3] * c[0] * geo.sp[0] + geo.D[r * 3 + 1] * c[1] * geo.sp[1] + geo.D[r * 3 + 2] * c[2] * geo.sp[2];
  return o;
}
function volCorners() {
  const out = [];
  for (const i of [-0.5, geo.n[0] - 0.5]) for (const j of [-0.5, geo.n[1] - 0.5]) for (const k of [-0.5, geo.n[2] - 0.5]) out.push(idx2phys([i, j, k]));
  return out;
}
const fmt = (x, d) => Number(x).toFixed(d === undefined ? 1 : d);
function coordText(p) {
  return fmt(Math.abs(p[0])) + (p[0] >= 0 ? ' L' : ' R') + ' · ' + fmt(Math.abs(p[1])) + (p[1] >= 0 ? ' P' : ' A') + ' · ' + fmt(Math.abs(p[2])) + (p[2] >= 0 ? ' S' : ' I') + ' mm';
}
function niceBar(pxPerMm, maxPx) {
  let best = null;
  for (const mm of [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000]) if (mm * pxPerMm <= maxPx) best = mm;
  return best === null ? null : { mm: best, px: best * pxPerMm };
}
function hexRgb(s) { s = (s || '').trim(); if (s[0] !== '#' || s.length < 7) return [0, 0, 0]; return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)]; }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// ---------- state ----------
const S = { c: geo ? geo.n.map(n => Math.floor(n / 2)) : [0, 0, 0], win: 'soft', overlay: false, ovOp: 0.45, planes: true, measure: false, sel: -1 };
const WINDOWS = { bone: [500, 2000], soft: [40, 400] };
const lut = new Array(256).fill(null);
if (lab) {
  const cols = meta.label_colors || {};
  for (let i = 1; i < 256; i++) {
    lut[i] = cols[i] ? hexRgb(cols[i]) : null;
    if (!lut[i]) { const hh = (i * 137.5) % 360, a = hh / 60, x = 1 - Math.abs(a % 2 - 1), t = [[1, x, 0], [x, 1, 0], [0, 1, x], [0, x, 1], [x, 0, 1], [1, 0, x]][Math.floor(a) % 6]; lut[i] = t.map(u => Math.round(60 + 170 * u)); }
  }
}

// ---------- structure list ----------
const reqs = { v3: false };
function request3d() { if (!reqs.v3) { reqs.v3 = true; requestAnimationFrame(() => { reqs.v3 = false; draw3d(); }); } }
const rowEls = [];
function select(i) {
  S.sel = S.sel === i ? -1 : i;
  rowEls.forEach((r, k) => { r.li.classList.toggle('sel', k === S.sel); r.detail.hidden = k !== S.sel; r.btn.setAttribute('aria-expanded', k === S.sel); });
  request3d();
}
function syncChecks() { rowEls.forEach((r, k) => { r.cb.checked = meshes[k].visible; }); }
function buildList() {
  const root = $('#groups');
  if (!meshes.length) { $('#structs').classList.add('hidden'); return; }
  const groups = [];
  meshes.forEach((m, i) => { let g = groups.find(x => x.name === m.group); if (!g) groups.push(g = { name: m.group, ids: [] }); g.ids.push(i); });
  for (const g of groups) {
    const ul = h('ul', { class: 'rows' });
    const setAll = on => { g.ids.forEach(i => { meshes[i].visible = on; }); syncChecks(); request3d(); };
    root.append(h('div', { class: 'group', role: 'group', 'aria-label': g.name },
      h('div', { class: 'ghead' }, h('h3', { text: g.name }), h('span', { class: 'acts' },
        h('button', { class: 'link', text: 'Show all', 'aria-label': 'Show all in ' + g.name, onclick: () => setAll(true) }),
        h('button', { class: 'link', text: 'Hide all', 'aria-label': 'Hide all in ' + g.name, onclick: () => setAll(false) }))), ul));
    for (const i of g.ids) {
      const m = meshes[i];
      const cb = h('input', { type: 'checkbox', 'aria-label': 'Show ' + m.label, onchange: () => { m.visible = cb.checked; request3d(); } });
      cb.checked = m.visible;
      const btn = h('button', { class: 'rname', text: m.label, 'aria-expanded': 'false', onclick: () => select(i) });
      const out = h('output', { text: Math.round(m.opacity * 100) + '%' });
      const op = h('input', { type: 'range', min: 0, max: 1, step: 0.05, value: m.opacity, 'aria-label': 'Opacity of ' + m.label,
        oninput: () => { m.opacity = parseFloat(op.value); out.textContent = Math.round(m.opacity * 100) + '%'; request3d(); } });
      const info = Object.entries(m.info || {});
      const detail = h('div', { class: 'detail', hidden: true },
        m.explain ? h('p', { class: 'explain', text: m.explain }) : null,
        h('label', { class: 'op' }, h('span', { text: 'Opacity' }), op, out),
        info.length ? h('dl', null, info.flatMap(([k, v]) => [h('dt', { text: k }), h('dd', { text: v })])) : null);
      const li = h('li', { class: 'row' }, h('div', { class: 'rhead' }, cb, h('span', { class: 'sw', style: 'background:' + m.color }), btn), detail);
      ul.append(li); rowEls[i] = { li, cb, btn, detail };
    }
  }
}
buildList();

// ---------- about ----------
(function () {
  const b = $('#aboutbody'); b.className = 'about';
  for (const s of meta.summary || []) b.append(h('p', { text: s }));
  const vx = meta.voxel_mm;
  if (vx) b.append(h('p', { text: 'The smallest detail the original scan can resolve is about ' + fmt(Math.max(...vx), 1) + ' mm (voxel size ' + vx.map(x => fmt(x, 2)).join(' × ') + ' mm). The numbers in the report use the full scan.' }));
  if (geo) b.append(h('p', { text: 'The ruler works on the reduced slices shown here, so a distance you measure is only good to about ' + fmt(Math.max(...geo.sp), 1) + ' mm.' }));
  if (geo) b.append(h('p', { class: 'fine', text: 'Slices shown here use ' + geo.n.join(' × ') + ' voxels of ' + geo.sp.map(x => fmt(x, 2)).join(' × ') + ' mm.' }));
  if ((meta.notes || []).length) b.append(h('ul', null, meta.notes.map(n => h('li', { text: n }))));
  b.append(h('p', { class: 'fine', text: DISCLAIMER }));
})();

// ---------- 2D slice views ----------
const views = [];
let ax = [0, 1, 2];
if (geo) {
  let bs = -1;
  for (const p of [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]]) {
    const s = Math.abs(geo.D[p[0]]) + Math.abs(geo.D[3 + p[1]]) + Math.abs(geo.D[6 + p[2]]);
    if (s > bs) { bs = s; ax = p; }
  }
  // ax[r] = voxel axis that mostly runs along LPS axis r
  const specs = [
    { id: 'axial', title: 'Axial', sub: 'cross-section, from the feet', f: ax[2], h: ax[0], v: ax[1], hr: 0, vr: 1, dv: 1, ed: ['R', 'L', 'A', 'P'] },
    { id: 'coronal', title: 'Coronal', sub: 'front view', f: ax[1], h: ax[0], v: ax[2], hr: 0, vr: 2, dv: -1, ed: ['R', 'L', 'S', 'I'] },
    { id: 'sagittal', title: 'Sagittal', sub: 'side view', f: ax[0], h: ax[1], v: ax[2], hr: 1, vr: 2, dv: -1, ed: ['A', 'P', 'S', 'I'] },
  ];
  for (const sp of specs) {
    const v = Object.assign({}, sp);
    v.fh = geo.D[sp.hr * 3 + sp.h] < 0; v.fv = geo.D[sp.vr * 3 + sp.v] * sp.dv < 0;
    v.Wmm = geo.n[v.h] * geo.sp[v.h]; v.Hmm = geo.n[v.v] * geo.sp[v.v];
    v.dirty = true; v.ruler = null; v.drag = null; v.hover = null; v.pending = false;
    const id = 'sl-' + v.id;
    v.cv = h('canvas', { tabindex: 0, 'aria-label': v.title + ' slice view. Page up and down or arrow keys change the slice. Drag to measure a distance. Click to move the other views to that point.' });
    v.range = h('input', { type: 'range', id, min: 0, max: geo.n[v.f] - 1, step: 1, value: S.c[v.f], 'aria-label': v.title + ' slice',
      oninput: () => setSlice(v.f, parseInt(v.range.value, 10)) });
    v.out = h('output', { for: id });
    v.ro = h('div', { class: 'readout' });
    v.wrap = h('div', { class: 'cv' }, v.cv);
    v.cell = h('section', { class: 'cell sl', 'aria-label': v.title + ' view' },
      h('div', { class: 'cellhead' }, h('h2', { text: v.title }), h('span', { class: 'sub', text: v.sub })), v.wrap,

  for (const m of meshes) {
    m.bp = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, m.bp); gl.bufferData(gl.ARRAY_BUFFER, m.v, gl.STATIC_DRAW);
    m.bn = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, m.bn); gl.bufferData(gl.ARRAY_BUFFER, m.n, gl.STATIC_DRAW);
    m.bi = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.bi); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.f, gl.STATIC_DRAW);
  }
  const planeBuf = gl.createBuffer();

  draw3d = function () {
    const { W, H } = dims(), dpr = window.devicePixelRatio || 1;
    for (const c of [glc, ovc]) if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    const bg = hexRgb(css('--canvas')), acc = hexRgb(css('--accent'));
    gl.viewport(0, 0, glc.width, glc.height);
    gl.clearColor(bg[0] / 255, bg[1] / 255, bg[2] / 255, 1); gl.clearDepth(1);
    gl.depthMask(true); gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const R = cam.R, hh = halfH(W, H), hw = hh * W / H, mpp = 2 * hh / H, ctr = frame.ctr;
    const tx = -(R[0] * ctr[0] + R[1] * ctr[1] + R[2] * ctr[2]) + cam.pan[0], ty = -(R[3] * ctr[0] + R[4] * ctr[1] + R[5] * ctr[2]) + cam.pan[1], tz = -(R[6] * ctr[0] + R[7] * ctr[1] + R[8] * ctr[2]);
    const view = new Float32Array([R[0], R[3], R[6], 0, R[1], R[4], R[7], 0, R[2], R[5], R[8], 0, tx, ty, tz, 1]);
    const proj = new Float32Array([1 / hw, 0, 0, 0, 0, 1 / hh, 0, 0, 0, 0, -1 / frame.depth, 0, 0, 0, 0, 1]);
    const rot = new Float32Array([R[0], R[3], R[6], R[1], R[4], R[7], R[2], R[5], R[8]]);
    gl.useProgram(pm);
    gl.uniformMatrix4fv(U.m.proj, false, proj); gl.uniformMatrix4fv(U.m.view, false, view); gl.uniformMatrix3fv(U.m.rot, false, rot);
    const drawMesh = (m, alpha, hi) => {
      gl.bindBuffer(gl.ARRAY_BUFFER, m.bp); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, m.bn); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.bi);
      gl.uniform4f(U.m.color, m.rgb[0], m.rgb[1], m.rgb[2], alpha); gl.uniform1f(U.m.hi, hi ? 1 : 0);
      gl.drawElements(gl.TRIANGLES, m.f.length, gl.UNSIGNED_INT, 0);
    };
    const vis = meshes.map((m, i) => ({ m, i })).filter(x => x.m.visible && x.m.opacity > 0.001);
    for (const { m, i } of vis) if (m.opacity >= 0.999) drawMesh(m, 1, i === S.sel);
    const tr = vis.filter(x => x.m.opacity < 0.999);
    if (tr.length) {
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false); gl.enable(gl.CULL_FACE);
      const depthOf = x => { const c = x.m.ctr; return R[6] * (c[0] - ctr[0]) + R[7] * (c[1] - ctr[1]) + R[8] * (c[2] - ctr[2]); };
      // back faces first (outer shells before inner ones), then front faces (inner shells before outer ones)
      tr.sort((a, b) => (b.m.diag - a.m.diag) || (depthOf(a) - depthOf(b)));
      gl.cullFace(gl.FRONT); for (const { m, i } of tr) drawMesh(m, m.opacity, i === S.sel);
      tr.reverse();
      gl.cullFace(gl.BACK); for (const { m, i } of tr) drawMesh(m, m.opacity, i === S.sel);
      gl.disable(gl.CULL_FACE); gl.depthMask(true); gl.disable(gl.BLEND);
    }
    if (S.planes && geo) {
      gl.useProgram(pl); gl.disable(gl.DEPTH_TEST);
      gl.uniformMatrix4fv(U.p.proj, false, proj); gl.uniformMatrix4fv(U.p.view, false, view);
      gl.uniform4f(U.p.color, acc[0] / 255, acc[1] / 255, acc[2] / 255, 1);
      gl.disableVertexAttribArray(1);
      for (const pts of planeCorners()) {
        gl.bindBuffer(gl.ARRAY_BUFFER, planeBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pts.flat()), gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.LINE_LOOP, 0, 4);
      }
      gl.enable(gl.DEPTH_TEST);
      gl.enableVertexAttribArray(1);
    }
    drawOverlay(W, H, dpr, mpp);
  };
}

function drawOverlay(W, H, dpr, mpp) {
  ov.setTransform(dpr, 0, 0, dpr, 0, 0); ov.clearRect(0, 0, W, H);
  const ink = css('--ink'), acc = css('--accent');
  ov.font = '12px system-ui,sans-serif';
  // measurement
  if (m3.pts.length) {
    const sp = m3.pts.map(p => toScreen(p, W, H, mpp));
    ov.strokeStyle = acc; ov.fillStyle = acc; ov.lineWidth = 2;
    if (sp.length === 2) { ov.beginPath(); ov.moveTo(sp[0][0], sp[0][1]); ov.lineTo(sp[1][0], sp[1][1]); ov.stroke(); }
    for (const s of sp) { ov.beginPath(); ov.arc(s[0], s[1], 4, 0, 7); ov.fill(); ov.strokeStyle = '#fff'; ov.lineWidth = 1.5; ov.stroke(); ov.strokeStyle = acc; ov.lineWidth = 2; }
    if (sp.length === 2) {
      const a = m3.pts[0], b = m3.pts[1], t = fmt(Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2])) + ' mm', mx = (sp[0][0] + sp[1][0]) / 2, my = (sp[0][1] + sp[1][1]) / 2;
      ov.font = '600 13px system-ui,sans-serif'; const tw = ov.measureText(t).width;
      ov.fillStyle = 'rgba(0,0,0,.72)'; ov.fillRect(mx - tw / 2 - 5, my - 24, tw + 10, 18); ov.fillStyle = '#fff'; ov.textAlign = 'center'; ov.textBaseline = 'middle'; ov.fillText(t, mx, my - 15);
    }
  }
  // orientation hint
  const cx = W - 46, cy = H - 46, rad = 24, R = cam.R;
  const axes = [[1, 0, 0, 'L'], [-1, 0, 0, 'R'], [0, 1, 0, 'P'], [0, -1, 0, 'A'], [0, 0, 1, 'S'], [0, 0, -1, 'I']].map(a => {
    const x = R[0] * a[0] + R[1] * a[1] + R[2] * a[2], y = R[3] * a[0] + R[4] * a[1] + R[5] * a[2], z = R[6] * a[0] + R[7] * a[1] + R[8] * a[2];
    return { x, y, z, l: a[3] };
  }).sort((p, q) => p.z - q.z);
  ov.textAlign = 'center'; ov.textBaseline = 'middle'; ov.font = '600 11px system-ui,sans-serif'; ov.strokeStyle = ink; ov.fillStyle = ink; ov.lineWidth = 1.2;
  for (const a of axes) {
    ov.globalAlpha = 0.3 + 0.6 * (a.z + 1) / 2;
    ov.beginPath(); ov.moveTo(cx, cy); ov.lineTo(cx + a.x * rad, cy - a.y * rad); ov.stroke();
    ov.fillText(a.l, cx + a.x * (rad + 8), cy - a.y * (rad + 8));
  }
  ov.globalAlpha = 1;
  // scale bar
  const sb = niceBar(1 / mpp, Math.min(140, W * 0.3));
  if (sb) {
    const x0 = 14, y0 = H - 18; ov.strokeStyle = ink; ov.fillStyle = ink; ov.lineWidth = 2; ov.textAlign = 'left'; ov.textBaseline = 'bottom'; ov.font = '12px system-ui,sans-serif';
    ov.beginPath(); ov.moveTo(x0, y0 - 4); ov.lineTo(x0, y0); ov.lineTo(x0 + sb.px, y0); ov.lineTo(x0 + sb.px, y0 - 4); ov.stroke(); ov.fillText(sb.mm + ' mm', x0, y0 - 6);
  }
}

if (gl) {
  const pointers = new Map();
  let down = null, lastPinch = 0;
  const rel = e => { const r = glc.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const zoomAt = (f, px, py) => {
    const { W, H } = dims(), mpp0 = mmPerPx();
    cam.zoom = Math.max(0.2, Math.min(60, cam.zoom * f));
    const mpp1 = mmPerPx(), qx = (px - W / 2) * mpp0, qy = -(py - H / 2) * mpp0;
    cam.pan[0] = qx * (mpp1 / mpp0) - (qx - cam.pan[0]); cam.pan[1] = qy * (mpp1 / mpp0) - (qy - cam.pan[1]);
  };
  glc.addEventListener('pointerdown', e => {
    try { glc.setPointerCapture(e.pointerId); } catch (_) { /* synthetic pointer */ } pointers.set(e.pointerId, rel(e));
    down = { x: e.clientX, y: e.clientY, moved: false, btn: e.button, shift: e.shiftKey, multi: pointers.size > 1 };
    if (pointers.size === 2) { const [a, b] = [...pointers.values()]; lastPinch = Math.hypot(a[0] - b[0], a[1] - b[1]); down.multi = true; }
  });
  glc.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId), cur = rel(e); pointers.set(e.pointerId, cur);
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) down.moved = true;
    if (pointers.size >= 2) {
      const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (lastPinch > 0 && d > 0) zoomAt(d / lastPinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      lastPinch = d;
      const mpp = mmPerPx(); cam.pan[0] += (cur[0] - prev[0]) / 2 * mpp; cam.pan[1] -= (cur[1] - prev[1]) / 2 * mpp;
    } else if (down && down.moved) {
      const dx = cur[0] - prev[0], dy = cur[1] - prev[1];
      if (down.btn === 2 || down.btn === 1 || down.shift) { const mpp = mmPerPx(); cam.pan[0] += dx * mpp; cam.pan[1] -= dy * mpp; } else rotate(dx, dy);
    }
    request3d();
  });
  const up = e => {
    const had = pointers.delete(e.pointerId);
    if (pointers.size < 2) lastPinch = 0;
    if (had && down && !down.moved && !down.multi && down.btn === 0 && pointers.size === 0) {
      const [x, y] = rel(e), hit = pick(x, y);
      if (S.measure) {
        if (hit) { if (m3.pts.length >= 2) m3.pts = []; m3.pts.push(hit.p); setHint(); }
      } else if (hit) select(hit.mi === S.sel ? -1 : hit.mi); else if (S.sel >= 0) select(S.sel);
      request3d();
    }
    if (pointers.size === 0) down = null;
  };
  glc.addEventListener('pointerup', up); glc.addEventListener('pointercancel', up);
  glc.addEventListener('contextmenu', e => e.preventDefault());
  glc.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = rel(e); zoomAt(Math.exp(-e.deltaY * 0.0015), x, y); request3d(); }, { passive: false });
  const reset = () => { cam.R = frame.R0.slice(); cam.zoom = 1; cam.pan = [0, 0]; request3d(); };
  glc.addEventListener('keydown', e => {
    const k = e.key, st = 10;
    if (k === 'ArrowLeft') { e.shiftKey ? cam.pan[0] += 0.05 * halfH(...Object.values(dims())) : rotate(-st, 0); }
    else if (k === 'ArrowRight') { e.shiftKey ? cam.pan[0] -= 0.05 * halfH(...Object.values(dims())) : rotate(st, 0); }
    else if (k === 'ArrowUp') { e.shiftKey ? cam.pan[1] -= 0.05 * halfH(...Object.values(dims())) : rotate(0, -st); }
    else if (k === 'ArrowDown') { e.shiftKey ? cam.pan[1] += 0.05 * halfH(...Object.values(dims())) : rotate(0, st); }
    else if (k === '+' || k === '=') cam.zoom = Math.min(60, cam.zoom * 1.2);
    else if (k === '-' || k === '_') cam.zoom = Math.max(0.2, cam.zoom / 1.2);
    else if (k === '0' || k === 'Home') { reset(); e.preventDefault(); return; }
    else if (k === 'Escape') { m3.pts = []; setHint(); } else return;
    e.preventDefault(); request3d();
  });
  $('#btn-reset').addEventListener('click', reset);
  const pb = $('#btn-planes');
  if (!geo) pb.classList.add('hidden');
  pb.addEventListener('click', () => { S.planes = !S.planes; pb.setAttribute('aria-pressed', S.planes); request3d(); });
  const mb = $('#btn-measure');
  mb.addEventListener('click', () => { S.measure = !S.measure; m3.pts = []; mb.setAttribute('aria-pressed', S.measure); glc.style.cursor = S.measure ? 'crosshair' : ''; setHint(); request3d(); });
  new ResizeObserver(() => request3d()).observe(cv3);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { request3d(); markAllDirty && views.forEach(redrawView); });
  setHint(); request3d();
}
if (geo) views.forEach(redrawView);
if (!meshes.length && !geo) say('This file contains no 3D structures and no scan volume.');
})();
</script>
