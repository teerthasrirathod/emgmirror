# emgmirror default configuration.
# Copy to `configs/me.local.yaml` (git-ignored) for your personal values and pass
# `--config configs/me.local.yaml` to any command.

acquisition:
  fs: 1000                 # samples per second per channel
  mains_hz: 50             # 50 in India/Europe, 60 in the Americas
  # How the raw ADC counts map to millivolts at the electrode.
  adc_bits: 10             # Arduino Uno/Nano = 10, ESP32 = 12
  adc_vref: 5.0            # ADC reference voltage (V)
  amp_gain: 1000.0         # total analog gain of the EMG front-end (check your board)
  serial_baud: 500000
  # Wire protocol for a bare port name: "text" (firmware/emg_stream, emg_candy_esp32: one CSV line per
  # sample, no sample index) or "emgm2" (firmware/emg_esp32_v2: framed, indexed, loss-detecting).
  protocol: text
  bias_mv: null            # EMGM/2 only: front-end idle level at the ADC pin; null = mid-rail (1650 mV)

# Raw recordings (append-only, exactly what the device sent). Derived layers live elsewhere.
raw_dir: data/raw

# Thresholds for the acquisition diagnostics (stream integrity and per-pin sanity).
diagnostics:
  rail_low_mv: 100         # pin mean below this, barely moving = stuck low
  rail_high_mv: 3000       # pin mean above this, barely moving = stuck high
  flat_p2p_mv: 2.0         # peak-to-peak over the window below this = flat
  clip_fraction: 0.01
  rate_tolerance: 0.02
  stall_s: 1.0
  window_s: 1.0
  mains_fraction: 0.6

# Every channel = one electrode pair. `arm` is left|right, `muscle` must match a
# muscle group in `anatomy.groups`.
#  - Mirror mode (simultaneous, needs >= 2 channels per arm): list both arms.
#  - Sequential mode (small kit): list one arm and pass --arm at record time;
#    the arm label is overridden per recording block.
channels:
  - { name: R_flex, arm: right, muscle: flexors }
  - { name: R_ext,  arm: right, muscle: extensors }
  - { name: L_flex, arm: left,  muscle: flexors }
  - { name: L_ext,  arm: left,  muscle: extensors }

processing:
  band_hz: [20, 450]       # upper edge is clipped to 0.45 * fs
  envelope_window_s: 0.10
  notch: true              # remove mains at all
  # Offline mains removal. "regression" fits and subtracts the hum (keeps the EMG
  # at 50/100/150 Hz: ~2 % RMS error in experiments); "notch" is the classic
  # filter (~15 % RMS loss, median frequency -16 Hz). The live view always uses a notch.
  mains_removal: regression

# Recording protocol. The same tasks are done with each arm (or both at once in
# mirror mode). `drive` is what the simulator uses as the descending command and
# what the on-screen guide shows as the target effort (0..1 of maximum).
protocol:
  - { task: rest,          kind: hold, level: 0.0,  duration_s: 5,  instruction: "Relax the forearm completely." }
  - { task: grip_mvc,      kind: hold, level: 1.0,  duration_s: 4,  instruction: "Squeeze as hard as you can." }
  - { task: wrist_flex_mvc,kind: hold, level: 1.0,  duration_s: 4,  instruction: "Bend the wrist toward the palm as hard as you can." }
  - { task: wrist_ext_mvc, kind: hold, level: 1.0,  duration_s: 4,  instruction: "Bend the wrist back as hard as you can." }
  - { task: grip_ramp,     kind: ramp, level: 0.6,  duration_s: 10, instruction: "Slowly increase grip from nothing to firm over 10 s." }
  - { task: grip_low_hold, kind: hold, level: 0.15, duration_s: 15, instruction: "Hold a light, steady grip (like holding a cup). 15 s: motor-unit estimates need >= 12 s." }
  - { task: open_close,    kind: reps, level: 0.6,  duration_s: 10, reps: 5, instruction: "Open and close the hand, once every 2 s." }
protocol_rest_between_s: 3

# Which muscle groups each task drives (0..1). Used by the simulator only.
task_muscle_drive:
  rest:           { flexors: 0.0,  extensors: 0.0 }
  grip_mvc:       { flexors: 1.0,  extensors: 0.45 }
  wrist_flex_mvc: { flexors: 1.0,  extensors: 0.10 }
  wrist_ext_mvc:  { flexors: 0.15, extensors: 1.0 }
  grip_ramp:      { flexors: 1.0,  extensors: 0.40 }
  grip_low_hold:  { flexors: 1.0,  extensors: 0.30 }
  open_close:     { flexors: 0.9,  extensors: 0.70 }

# Tape-measure values (cm). Measured on both arms, same landmarks:
# length = elbow crease to wrist crease; proximal = widest girth (~1/3 down from
# elbow); distal = girth just above the wrist bones.
subject:
  right: { length_cm: 26.0, circ_proximal_cm: 27.0, circ_distal_cm: 16.5 }
  left:  { length_cm: 26.0, circ_proximal_cm: 24.5, circ_distal_cm: 16.0 }

anatomy:
  # Channel muscle group -> anatomical muscles drawn in 3D.
  groups:
    flexors:   [FCR, PL, FDS, FDP, FCU]
    extensors: [ECRL, ECRB, EDC, ECU]
    brachioradialis: [BR]
    pronators: [PT]
    supinators: [SUP]

# Synthetic data. Only used when there is no real recording yet.
simulation:
  seed: 7
  motor_units_per_muscle: 120      # healthy pool (scaled down from real counts)
  noise_uv_rms: 4.0
  mains_uv: 15.0
  # Post-injury model for the LEFT arm, per muscle group.
  #  mu_fraction: share of motor units that still have a working nerve supply
  #  enlargement: size gain of surviving units from collateral reinnervation
  #  drive_max:   how much of the maximum descending drive reaches the pool
  left_impairment:
    flexors:   { mu_fraction: 0.35, enlargement: 1.5, drive_max: 0.80 }
    extensors: { mu_fraction: 0.50, enlargement: 1.3, drive_max: 0.85 }
    brachioradialis: { mu_fraction: 0.70, enlargement: 1.2, drive_max: 0.90 }
    pronators:       { mu_fraction: 0.50, enlargement: 1.3, drive_max: 0.85 }
    supinators:      { mu_fraction: 0.60, enlargement: 1.2, drive_max: 0.90 }
