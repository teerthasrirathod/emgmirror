# Two channels, as wired 2026-11-17 (owner): CH1 = GPIO35 (header D35), CH2 = GPIO36 (header VP).
# History: the faulty Candy was removed; VCC of both remaining Candys measured 3.22 V (owner).
# The wire first on D34 read ~0.7 V there and works on VP; the wire on VN never reached GPIO39 and was
# moved to D35. With cables in but electrodes off, both outputs saturate on 50 Hz hum (open inputs).
# Whether GPIO35 carries a normal Candy output is confirmed only once electrodes are on.
base: configs/esp32_candy.yaml

hardware:
  channels:
    - { ch: 1, gpio: 35, adc_channel: ADC1_CH7, header: D35, sensor: "Candy OUT (moved from VN, 2026-11-17)" }
    - { ch: 2, gpio: 36, adc_channel: ADC1_CH0, header: VP,  sensor: "Candy OUT (moved from D34; driven ~1.66 V)" }

# Rig enclosure (owner, 2026-11-17 ~16:30, before the 16:40 floor): each Candy heat-sealed in plastic
# packaging film; ESP32, breadboard and Candys in a cardboard box suspended in the air by ropes.
# Plastic and cardboard do not block electric fields; the floor drop that followed (CH2 50 Hz 634 -> 40
# mV rms, 100/150 Hz ~200x down) most likely came from distance to mains sources and fixed cable runs.
# Not yet separated by one-change-at-a-time tests. Planned frugal upgrades: grounded foil lining, twisted pairs.
rig:
  enclosure: "Candys heat-sealed in plastic film; whole rig in a cardboard box hung from ropes"
  shielding: none (no conductive layer)
  since: 2026-11-17

# Room noise floor, measured 2026-11-17 in this room with gel electrodes on (rest trial; band-pass
# 75-450 Hz + mains regression; RMS at the ADC pin). Re-measure when the room, electrodes or wiring
# change: every recording's own rest trial is used as its floor; these are the reference values.
# docs/test_results/physical/2026-11-17_room_noise_floor.json
room_noise_floor:
  measured: "2026-11-17 16:40, after the rig enclosure change (100/150 Hz harmonics ~200x down)"
  recording: 20261117-164051_rest-floor-after-change
  pin_mv_rms: { ch1: 12.3, ch2: 18.4 }
  mains50_pin_mv_rms: { ch1: 73, ch2: 40 }
  # earlier the same day: ch1 22.4 / ch2 48.9 (morning), ch1 35.5 / ch2 117.6 (15:55, CH2 clipping 21 %)
  active_threshold_x_floor: 2.0   # a 250 ms window counts as "active" above 2x the floor (6 dB)

# Sequential mode: pass --arm right|left at record time. Rename muscles to where the electrodes go.
channels:
  - { name: ch1, arm: right, muscle: flexors }
  - { name: ch2, arm: right, muscle: extensors }
