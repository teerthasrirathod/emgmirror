# Extended protocol: the standard calibration tasks plus forearm rotation and
# physiotherapy exercises from the movement library (src/emgmirror/simulate/movements.py).
# Use with:  emgmirror --config configs/extended_protocol.yaml record ...
# Ask your physiotherapist before doing maximal tasks with the recovering arm.

protocol:
  - { task: rest,             kind: hold, level: 0.0,  duration_s: 5,  instruction: "Relax the forearm completely, palm up, supported." }
  - { task: grip_mvc,         kind: hold, level: 1.0,  duration_s: 4,  instruction: "Squeeze as hard as you can." }
  - { task: wrist_flex_mvc,   kind: hold, level: 1.0,  duration_s: 4,  instruction: "Bend the wrist toward the palm as hard as you can." }
  - { task: wrist_ext_mvc,    kind: hold, level: 1.0,  duration_s: 4,  instruction: "Bend the wrist back as hard as you can." }
  - { task: grip_ramp,        kind: ramp, level: 0.6,  duration_s: 10, instruction: "Slowly increase grip from nothing to firm over 10 s." }
  - { task: grip_low_hold,    kind: hold, level: 0.15, duration_s: 15, instruction: "Hold a light, steady grip (like holding a cup)." }
  - { task: grip_mid_hold,    kind: hold, level: 0.4,  duration_s: 8,  instruction: "Hold a medium grip (about 40% of your best)." }
  - { task: hammer_curl,      kind: hold, level: 0.5,  duration_s: 5,  instruction: "Thumb up, bend the elbow against light resistance." }
  - { task: pronation_hold,   kind: hold, level: 0.5,  duration_s: 5,  instruction: "Thumb up; try to turn the palm down against your other hand." }
  - { task: supination_hold,  kind: hold, level: 0.5,  duration_s: 5,  instruction: "Thumb up; try to turn the palm up against your other hand." }
  - { task: pro_sup_rotation, kind: reps, level: 0.5,  duration_s: 10, reps: 5, instruction: "Turn palm down, then up, once every 2 s." }
  - { task: putty_squeeze,    kind: reps, level: 0.6,  duration_s: 10, reps: 5, instruction: "Squeeze putty/ball and release, once every 2 s." }
  - { task: tendon_glides,    kind: reps, level: 0.5,  duration_s: 12, reps: 4, instruction: "Straight hand -> hook fist -> full fist, slowly." }
  - { task: finger_spread_band, kind: reps, level: 0.5, duration_s: 10, reps: 5, instruction: "Open the fingers against a rubber band, once every 2 s." }
protocol_rest_between_s: 4

task_muscle_drive:
  grip_mid_hold:      { flexors: 1.0,  extensors: 0.45 }
  hammer_curl:        { flexors: 0.2,  extensors: 0.2 }
  pronation_hold:     { flexors: 0.35, extensors: 0.1 }
  supination_hold:    { flexors: 0.05, extensors: 0.25 }
  pro_sup_rotation:   { flexors: 0.3,  extensors: 0.2 }
  putty_squeeze:      { flexors: 1.0,  extensors: 0.45 }
  tendon_glides:      { flexors: 0.6,  extensors: 0.4 }
  finger_spread_band: { flexors: 0.1,  extensors: 0.7 }
