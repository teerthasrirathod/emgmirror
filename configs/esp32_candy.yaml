# emgmirror configuration: ESP32 DevKit + 3x Muscle BioAmp Candy, firmware/emg_esp32_v2 (EMGM/2).
# Merged over configs/default.yaml. Copy to configs/me.local.yaml (git-ignored) for personal values.
#
# Every hardware statement below carries how it is known. "verified" = measured or read from the
# device on the date given. Anything else is an assumption that has not been checked on this unit.

acquisition:
  protocol: emgm2          # firmware/emg_esp32_v2; "text" = older emg_stream / emg_candy_esp32
  fs: 2000                 # requested output rate per channel; the device's HELLO is authoritative
  mains_hz: 50
  adc_bits: 12
  adc_vref: 3.3            # used only by the legacy text protocol; EMGM/2 carries eFuse calibration
  amp_gain: 2420.0         # Muscle BioAmp Candy nominal gain (vendor figure, NOT measured on these boards)
  bias_mv: 1650            # assumed idle output level (mid-rail of 3.3 V), NOT measured
  serial_baud: 500000

hardware:
  board:
    name: ESP32 DevKit (30-pin, CH340 USB-serial)
    chip: ESP32-D0WD-V3 rev v3.1          # verified 2026-11-16 (esptool flash-id)
    mac: "48:9d:31:04:70:70"               # verified 2026-11-16
    flash: 4 MB                            # verified 2026-11-16
    usb_serial: CH340, VID:PID 1A86:7523   # verified 2026-11-16 (enumerates as COM9 today; was COM12, COM7)
  firmware:
    source: firmware/emg_esp32_v2/emg_esp32_v2.ino
    version: 2.1.0 (flashed 2026-11-16, hash verified)
    protocol: EMGM/2 (docs/ACQUISITION_PROTOCOL.md)
  adc:
    unit: ADC1               # ADC1 only: not blocked by the radio
    attenuation_db: 12       # usable input ~0.15 to ~3.1 V
    calibration: eFuse line fitting, reported by the device in HELLO
  # Channel order = data column order = config `channels` order. The host sends this pin map to the
  # device (PINS, stored in the ESP32 NVS) whenever the device reports a different one.
  # Wiring, 2026-11-16: one 3-way connector on header D34 / VN / VP (owner, plus photo: red, green,
  # purple left to right); each wire goes to a different Candy OUT (owner).
  # Driven test (acq scan, plugged vs unplugged, docs/test_results/physical/2026-11-16_pinscan_*.json):
  #   GPIO36 is driven at ~1.66 V only while the connector is on; GPIO34 and GPIO39 read as floating
  #   both ways, so the Candys on the red and green wires are NOT driving their outputs.
  channels:
    - { ch: 1, gpio: 34, adc_channel: ADC1_CH6, wire: red,    sensor: "Candy OUT (not driving: no output seen 2026-11-16)" }
    - { ch: 2, gpio: 39, adc_channel: ADC1_CH3, wire: green,  sensor: "Candy OUT (not driving: no output seen 2026-11-16)" }
    - { ch: 3, gpio: 36, adc_channel: ADC1_CH0, wire: purple, sensor: "Candy OUT (driven, ~1.66 V idle, 2026-11-16)" }
  front_end:
    model: Upside Down Labs Muscle BioAmp Candy (1 channel per board)   # from purchase/earlier sessions, not inspected today
    supply: ESP32 3V3 + GND (owner, 2026-11-16)                         # NOT measured
    gain: 2420 (vendor nominal)                                         # NOT measured
  safety_gate: blocked       # see docs/ELECTRICAL_SAFETY.md; no electrodes on a person until this is "passed"

# Sequential mode: all three channels on one arm; pass --arm at record time.
# Which muscle each channel records is decided when electrodes are placed; rename these then.
channels:
  - { name: flex,  arm: right, muscle: flexors }
  - { name: ext,   arm: right, muscle: extensors }
  - { name: brach, arm: right, muscle: brachioradialis }

processing:
  band_hz: [75, 700]       # inside the Candy's hardware band
  envelope_window_s: 0.10
  notch: true
  mains_removal: regression
